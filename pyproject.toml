[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroshadow-security"
version = "0.1.0"
description = "Safe, contract-neutral Python security intelligence services for ZeroShadow AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scanner = ["bandit>=1.7,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
